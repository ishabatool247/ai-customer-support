<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice AI Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎤 Voice AI Assistant</h1>
        <p>Your personal AI voice companion</p>
    </div>


    <div class="assistant-card">

        <div class="robot">
            🤖
        </div>

        <h2>Ready to help</h2>

        <p id="status">
            Press Start to talk.
        </p>


        <div class="buttons">

            <button id="startBtn" class="start">
                🎤 Start Talking
            </button>

            <button id="stopBtn" class="stop">
                🛑 Stop
            </button>

        </div>

    </div>


    <div class="chat-container">

        <h3>💬 Conversation</h3>

        <div id="chatBox">
        </div>

    </div>


</div>


<script src="/static/script.js"></script>

</body>

</html>
